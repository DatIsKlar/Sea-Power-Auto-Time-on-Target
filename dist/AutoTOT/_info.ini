[Language_en]
Name=Auto Time-on-Target
Description=Coordinated Time-on-Target strikes. Order missiles in the game or pick them in the planner panel (Alt+G), and each launch is delayed so everything lands at once: from one ship, a whole formation, or several formations at several targets (Alt+H). Slower and farther missiles fire first. Requires the Anchor Chain mod: enable both in the Mods menu and fully restart the game.

[Compatibility]
; Soft match: same Major.Minor, game Patch >= declared. A newer game Major.Minor only warns.
