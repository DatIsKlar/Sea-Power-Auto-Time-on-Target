[Language_en]
Name=Auto Time-on-Target
Description=Coordinated Time-on-Target strikes. Fire missiles at a single target and each launch is delayed automatically so they all land at once. Slower and farther missiles fire first, faster and closer ones fire last. Also works for the entire formation. To select the target just select it on the tactical map and it will be shown in the menu at the top. Requires the Anchor Chain mod, enable in the Mods menu and fully restart the game.

[Compatibility]
; Soft match: same Major.Minor, game Patch >= declared. A newer game Major.Minor only warns.
ApproximateVersion=0.8.0
