; Public-branch formation freeze, stalled-order run (docs/plans/open/public-formation-freeze.md). Runs 1 and 2
; did not freeze: every order launched. The open question is what a strike the game can NEVER finish does
; to the formation's radars and air defence while the Ticonderoga's Harpoons are inbound.
;
; The stall is the game's own: an engage task whose rounds come due inside the weapon's minimum launch range
; turns the ship to unmask and then holds forever (see the min-launch-range finding). The coordinator drops an
; order already inside the minimum at commit (Coordinator.Channels.cs:353) but does not re-test it at release,
; so a ripple committed just outside it crosses the line partway. SS-N-19 and SS-N-12 both have a 30 nm minimum.
;
; Geometry: Enterprise and the Ticonderoga start 34 nm from the Kirov and both groups run at flank toward each
; other. The panel fires when the Kirov is 30.8 nm out, with full salvos so the ripples last long enough to
; cross 30 nm. TimeoutSec is the observation window after firing; a STUCK result is the expected outcome.
[freeze-stall]
Mission=autotot freeze min range stall.ini
Compression=1
WaitForContactSec=240
HoldUntilRangeNm=Taskforce1Vessel1:30.8
TimeoutSec=600
TraceFlightModel=false
PanelFire=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 20
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | wp_ss-n-12 | 16
