; Acceptance runs for launcher-startup-delay item 4: ReleaseLead centres the SHIP'S pooled ripple.
; Predictions and kill criteria are in docs/plans/open/launcher-startup-delay.md, written before
; these ran. Baselines: runs/20260913-133907-shared-timer-A2, runs/20260913-134049-shared-timer-A4,
; runs/20260913-133525-shared-timer-B-elapsed, and pooled-release-lead-baseline.ini for the
; follower case.
;
; Read three things per section: the `shared-clock` commit line (pool size, interval, lead), the
; absolute launch times in gamelogs/*sessionEventLog*, and the `impact ... residual` lines.

; Pool on the ANCHOR'S ship. Launch times must not move; only the time on target does.
[pool-A2]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 2

[pool-A4]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 4
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 4

; Control. Same ship and clock, but the second order releases about 30 s after a 1-round first
; order, so the two never share the clock. Must print `not pooled` and change nothing.
[pool-B-control]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 1
Shot2=Taskforce1Vessel1 > Taskforce2Vessel3 | usn_rgm-84d | 1

; Pool on a FOLLOWER ship, released by the gate. Unlike A2/A4 the pool's launches SHOULD move
; earlier, by the lead increase the commit line prints.
[pool-follower]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | plan_yj-18a | 4
Shot3=Taskforce1Vessel2 > Taskforce2Vessel2 | plan_yj-18a | 4
