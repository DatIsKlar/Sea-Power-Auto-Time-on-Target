; Release 0.2.1 audit, pass 4: where a frame goes, before and after the audit's changes.
; Section 1 is the standing large-strike case with Profiling on. Section 2 holds the planner panel open
; with a staged row and nothing firing, so the panel's own per-frame cost is read with no strike load.
[perf-big-strike]
Mission=test sandro fps.ini
Compression=10
TraceFlightModel=false
Profiling=true
WaitForContactSec=240
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | * | 4
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | * | 4
Shot3=Taskforce1Vessel3 > Taskforce2Vessel2 | * | 4
Shot4=Taskforce1Vessel4 > Taskforce2Vessel2 | * | 4
Shot5=Taskforce1Vessel18 > Taskforce2Vessel3 | * | 4
Shot6=Taskforce1Vessel19 > Taskforce2Vessel3 | * | 4

[perf-panel-idle]
Mission=test sandro fps.ini
Compression=1
TraceFlightModel=false
Profiling=true
WaitForContactSec=240
TimeoutSec=600
PanelHoldSec=60
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | * | 4
