; wp_ss-n-19 and wp_ss-n-12 are the two families whose seekers cross to a
; neighbour. Both declare TargetMemory=True, which is supposed to hold the
; preselected target, and both still retargeted at 1.5 nm and again at 10 nm of
; separation, turning a scoreable round into an unscoreable one.
;
; Their seekers are the largest in the corpus: ss-n-19 is 35 nm at 120 degrees
; total FOV, ss-n-12 is 25 nm at 90. So the merchants here are 48 nm apart,
; further than either seeker can reach, and nothing else is in the mission.
[ssn19-ssn12]
Mission=autotot ssn19 ssn12.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel2 | wp_ss-n-12 | 1

[ssn19-ssn12-2]
Mission=autotot ssn19 ssn12.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel2 | wp_ss-n-12 | 1
