; Baseline for launcher-startup-delay item 4 (pooled release lead), flown on the build BEFORE the
; change so the post-build run of the same section is an exact A/B: a repeat run of one mission
; draws the same per-round motor rolls.
;
; The case A2 and A4 cannot reach: the pooled ship is a FOLLOWER, released by the gate, not the
; anchor. The Spruance's single Harpoon (514 s) anchors. The Type 055 fires two 4-round YJ-18A
; orders at two targets 77.4 and 77.2 nm away, both on its H_HT-1_Hot clock
; (SharedLaunchInterval=2, WeaponSystem9, always loaded).
;
; Expected on this build: each 055 order centres on its OWN 4-round ripple, so the eight rounds
; leave as one ripple and the order served second lands late by roughly half the other order's
; span. Read absolute launch times from gamelogs/*sessionEventLog*.
[pool-follower-baseline]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | plan_yj-18a | 4
Shot3=Taskforce1Vessel2 > Taskforce2Vessel2 | plan_yj-18a | 4
