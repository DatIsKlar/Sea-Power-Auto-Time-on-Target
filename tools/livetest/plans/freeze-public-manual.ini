; Public-branch formation freeze, runs A and B (docs/plans/open/public-formation-freeze.md). The same
; section is flown twice, identical except for the AUTO setting:
;
;   A: AUTO off (the default). Confirms the unticked-rows fix: the panel fire must now send exactly the two
;      ticked orders (Kirov, Slava), not five. It is also the control for B.
;   B: CFG_OVERRIDE="AutoModeOnStart=true". Tests defects D-B and D-C: with AUTO on, a player's manual SAM
;      order at an inbound missile goes through Coordinator.TryIntercept, which the code says collects it for
;      time-on-target coordination instead of letting the game fire. That would read as "the ship will not
;      respond to manual fire commands".
;
; ManualAtInbound issues each line once, when a missile threatens that ship (ObjectBase.ThreateningMissile)
; and is inside the SAM's range, through ObjectBase.InsertEngageTask with autoAttack false and no bypass:
; exactly what the game's own attack order (AttackTask.OnExecute) does, so the mod's Harmony prefix sees it
; as a player order. Evidence: the game event log shows "Engage Task : [missile], <sam>, auto = False" only
; if the order reached the game, and LogOutput.log shows "queued ... -> [missile]" if the mod collected it.
[freeze-panel-manual]
Mission=autotot freeze kirov slava enterprise aew.ini
Compression=1
WaitForContactSec=240
HoldUntilSec=240
TimeoutSec=900
TraceFlightModel=false
PanelFire=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 8
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | wp_ss-n-12 | 8
ManualAtInbound1=Taskforce1Vessel4 | wp_sa-n-7 | 1
ManualAtInbound2=Taskforce1Vessel2 | wp_sa-n-6 | 1
