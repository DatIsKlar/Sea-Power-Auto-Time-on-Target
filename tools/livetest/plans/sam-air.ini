; The last three families with no current capture, and all three for one reason:
; usn_rim-162h, usn_rim-66b and usn_rim-66e declare TargetType=AAW, so the game
; refuses them against a surface contact however the panel reads. They need an
; enemy AIRCRAFT, which no standing mission provides: test aa has air units but
; every one of them is in Taskforce1.
;
; autotot sam air puts three E-2Cs in Taskforce2 at 25,000 ft, starting 25 nm out
; and flying IN, so the launch falls inside every band here (rim-66 2.5 to 25 nm,
; rim-162h 0.5 to 27) with room to spare.
;
; HoldUntilSec=100 because a freshly spawned aircraft is NOT a scoreable target:
; the first cut fired at once and every round was excluded, the E-2Cs having
; accelerated 238 to 325 kn and turned 20 to 27 degrees during the flight. They
; are given a heading that already matches their waypoint and 100 s to settle on
; it, which is the same reason the ship missions set a start telegraph. One target per shot, because a SAM kills what it hits and a shared
; target would end the other rounds. Taskforce1 vessels default to WeaponStatus
; Tight, so nothing engages them before the ordered shot.
;
; TWO Adams, because rim-66b and rim-66e are the same hull on different loadouts:
; WeaponMagazineMK13 carries usn_rim-66b and WeaponMagazineMK13Late usn_rim-66e,
; so one ship can only ever offer one of them. Vessel1 is pinned to Default and
; Vessel3 to Late.
[sam-air]
Mission=autotot sam air.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
HoldUntilSec=100
Shot1=Taskforce1Vessel2 > Taskforce2Aircraft1 | usn_rim-162h | 1
Shot2=Taskforce1Vessel1 > Taskforce2Aircraft2 | usn_rim-66b | 1
Shot3=Taskforce1Vessel3 > Taskforce2Aircraft3 | usn_rim-66e | 1

[sam-air-2]
Mission=autotot sam air.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
HoldUntilSec=100
Shot1=Taskforce1Vessel2 > Taskforce2Aircraft1 | usn_rim-162h | 1
Shot2=Taskforce1Vessel1 > Taskforce2Aircraft2 | usn_rim-66b | 1
Shot3=Taskforce1Vessel3 > Taskforce2Aircraft3 | usn_rim-66e | 1
