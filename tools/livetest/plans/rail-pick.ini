; Kill criterion 1 for docs/plans/done/2026-09-13-launcher-pick-by-arc.md.
; A Spruance (VLS) with two MK141 groups 180 degrees apart, two rounds at each of
; two targets. For every round the capture's LaunchHeading must match field 7 of
; its own FlightTrack at t = 0 for the round that leaves first from each order.
[rail-pick]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 2

; Kill criterion 3: a single-launcher ship must be untouched. plan_yj-18a off a
; Type 055 through one VLS, same mission.
[rail-pick-control]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel2 > Taskforce2Vessel3 | plan_yj-18a | 1

; Re-run of the two families that crossed seekers, now 48 nm apart AND removed
; from the Taskforce2 formation. A formation places its members itself, so the
; first attempt's 48 nm separation was silently collapsed to 0.6 nm.
[ssn19-ssn12]
Mission=autotot ssn19 ssn12.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel2 | wp_ss-n-12 | 1

[ssn19-ssn12-2]
Mission=autotot ssn19 ssn12.ini
Compression=10
