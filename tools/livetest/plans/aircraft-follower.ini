; Aircraft as FOLLOWER, the run docs/plans/open/submarine-and-aircraft-launch-envelope.md owes.
;
; No mission edit is needed to flip the roles. Who anchors is decided by enroute time, and the
; Hornet is flying at its target, so the strike only has to wait. At 70 nm its subsonic Harpoon
; outlasts anything the ship can fire and it is elected anchor; let it run in to 30 nm and the
; ship's YJ-18A, still about 70 nm out, becomes the longest enroute instead.
;
; Two merchants, one each, so neither shooter's rounds retire early when the other's target sinks.
; That cost the previous aircraft run both its Harpoon residuals.
[aircraft-follower]
Mission=autotot aircraft follower.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
HoldUntilRangeNm=Taskforce1Aircraft1:30
Shot1=Taskforce1Aircraft1 > Taskforce2Vessel1 | usn_agm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-18a | 2
