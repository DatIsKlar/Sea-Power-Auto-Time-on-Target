; teest: a Type 055 and a Burke Flight III about 93 nm from one merchant (range opened by the
; user on 2026-09-12 so the hypersonic round clears its floor). One time-on-target across two
; ships and the widest speed spread the units can produce, which is where per-weapon estimate
; bias shows up as salvo desync.
;
; Launch envelopes, read from the workshop ammunition files (nm):
;   plan_yj-20  60-995   hypersonic      plan_yj-18a     25-351
;   usn_rgm-109e5a 15-950 subsonic       usn_rim-174b    1-260
;   usn_rim-66p 0.5-110                  usn_rim-162h    0.5-27  (out of range at 93 nm)
[mixed-kinematic-hypersonic]
Mission=teest.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-20 | 2
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | usn_rgm-109e5a | 2

; Same geometry, both Chinese rounds: hypersonic against the subsonic-cruise YJ-18A.
[mixed-chinese]
Mission=teest.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-20 | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-18a | 2
