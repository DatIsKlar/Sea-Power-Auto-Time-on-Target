; DIAGNOSTIC for docs/plans/open/closing-shooter-cannot-be-held.md. Same mission and same ship in
; every section; only the range the Hornet fires from changes. Kill criteria are in the plan and
; were written before this ran.
;
; The ship's YJ-18A is enroute about 362 s, and the Harpoon needs about 6.58 s per nautical mile,
; so the aircraft is the ANCHOR beyond roughly 55 nm and the FOLLOWER inside it. That makes 60 nm
; the anchor control and the other two the failing case at both ends of its band.

[closing-60nm]
Mission=autotot aircraft follower.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
HoldUntilRangeNm=Taskforce1Aircraft1:60
Shot1=Taskforce1Aircraft1 > Taskforce2Vessel1 | usn_agm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-18a | 2

