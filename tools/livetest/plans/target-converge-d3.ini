; D3 of docs/plans/open/max-solo-error-below-1s.md, section "D3: the speed a slowing target is
; converging on". An exact repeat of multi-domain.ini on the UNSETTLED test aa mission, whose
; merchants start on telegraph 3 and where Taskforce2Vessel1 is still slowing to telegraph 2 while
; the first Harpoons are solved. Each .result records the target's wanted speed and its capped
; converge speed at the solve, and every change after it. Criteria P0, W1 to W3, L1 and the gap
; prediction were written in the plan before this ran. No HoldUntilSec: the point is to solve
; while the target is still slowing.
[d3-multi-domain]
Mission=test aa.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 2
Shot2=Taskforce1Vessel3 > Taskforce2Vessel2 | usn_rgm-84a | 2
Shot3=Taskforce1Submarine1 > Taskforce2Vessel3 | wp_ss-n-19 | 2
