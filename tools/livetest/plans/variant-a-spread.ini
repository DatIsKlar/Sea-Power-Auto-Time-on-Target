; S4 of docs/plans/open/max-solo-error-below-1s.md, "Variant A build": every upstream correction and the hull
; rule built and installed (f4b0360). A spread over the families the build changes: sea-skimmers, the SAM climb,
; the YJ-20 descent, the pop-up and terminal-turn divers (agm-84d, rgm-84d) and yj-18a. Each section is copied
; unchanged from the plan that flew it before. Reads: parity on every capture, each gap measured to the hit, and
; the hull source (identified, size class, noise) each target's contact state gives at fire.
; Criteria were written in the plan before this flew.

