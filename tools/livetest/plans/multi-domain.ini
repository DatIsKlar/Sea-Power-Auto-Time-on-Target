; test aa: a cross-formation strike from two ships and a submarine at three separate merchants.
; Ammunition pinned from the 2026-09-12 inventory probe. Aircraft shooters are deliberately left
; out: they must be airborne and inside the envelope at fire time, and a shot that cannot resolve
; rejects the whole run. The F/A-18A (usn_agm-84d) and the MiG-27 (wp_as-14b) both read USABLE in
; that probe, so they are the candidates when aircraft work starts.
[multi-domain]
Mission=test aa.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 2
Shot2=Taskforce1Vessel3 > Taskforce2Vessel2 | usn_rgm-84a | 2
Shot3=Taskforce1Submarine1 > Taskforce2Vessel3 | wp_ss-n-19 | 2
