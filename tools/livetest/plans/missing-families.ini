; Modern captures for the WP families the gate still judges on obsolete schemas.
; One round per shot, so every capture is SOLO: ss-n-19 and ss-n-12 declare
; GroupSize 24 and 16 and a grouped round scores separately.
;
; Geometry rules this mission exists to satisfy, both learned the hard way on
; 2026-09-13:
;   * every family gets its OWN merchant, 10 nm apart across the line of fire
;     (12 to 23 degrees of bearing separation at 48 nm). A first attempt put four
;     merchants 1.5 nm apart with one of them ON the flight path, and the ss-n-19
;     and ss-n-12 seekers both crossed to it. A retargeted round cannot be scored,
;     and killing the shared target ended the fourth round's measurement early.
;   * wp_ss-n-22 declares MaxLaunchRange 50 nm, so it gets a near merchant placed
;     40 degrees off the others' bearing rather than short along the same one.
;   * the two Sovremennys carry DIFFERENT weapons through LoadoutVariant: Default
;     mounts wp_ss-n-22, Late mounts wp_ss-n-22b. Without the key the hull answers
;     ss-n-22b at every mission date tried.
[wp-families]
Mission=autotot wp families.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel5 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel6 | wp_ss-n-12 | 1
Shot3=Taskforce1Submarine1 > Taskforce2Vessel7 | wp_ss-n-3 | 1
Shot4=Taskforce1Vessel5 > Taskforce2Vessel8 | wp_ss-n-22b | 1
Shot5=Taskforce1Vessel4 > Taskforce2Vessel9 | wp_ss-n-22 | 1

; Second round of each, same geometry. The game seeds motor rolls per mission
; load, so a repeat is a real second sample rather than a copy.
[wp-families-2]
Mission=autotot wp families.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel5 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel6 | wp_ss-n-12 | 1
Shot3=Taskforce1Submarine1 > Taskforce2Vessel7 | wp_ss-n-3 | 1
Shot4=Taskforce1Vessel5 > Taskforce2Vessel8 | wp_ss-n-22b | 1
Shot5=Taskforce1Vessel4 > Taskforce2Vessel9 | wp_ss-n-22 | 1
