; test sandro fps: many shooters committing at once, about 62 nm. This is the performance case
; behind the deferred commit, so watch the frame times in the log as much as the residuals.
[big-strike-fps]
Mission=test sandro fps.ini
Compression=10
TraceFlightModel=false   ; this scenario measures frame time; the trace runs extra sims per round
Profiling=true           ; per-frame timing every 60 frames
WaitForContactSec=240
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | * | 4
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | * | 4
Shot3=Taskforce1Vessel3 > Taskforce2Vessel2 | * | 4
Shot4=Taskforce1Vessel4 > Taskforce2Vessel2 | * | 4
Shot5=Taskforce1Vessel18 > Taskforce2Vessel3 | * | 4
Shot6=Taskforce1Vessel19 > Taskforce2Vessel3 | * | 4
