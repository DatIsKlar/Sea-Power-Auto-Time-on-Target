; DIAGNOSTIC for docs/plans/open/yj-20-loft-variance.md. Six plan_yj-20 from ONE launcher at
; near-identical geometry, to test whether loft peak altitude and flight time move together.
;
; Three targets rather than one, 1.4 nm apart at 93 nm, so no round retires early when a hull
; sinks. That cost the aircraft runs their residuals earlier today. The 055 carries eight rounds.
;
; Kill criteria are in the plan and were written before this ran: if peak altitude and flight time
; do not correlate, the hypothesis is wrong and the stage transition timestamps are the next place
; to look.
[yj20-loft-variance]
Mission=autotot yj20 loft.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-20 | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-20 | 2
Shot3=Taskforce1Vessel1 > Taskforce2Vessel3 | plan_yj-20 | 2
