; HA4 of docs/plans/open/max-solo-error-below-1s.md, "Hull arrival": does a sea-skimmer's flight end where it
; enters the hull? Every Harpoon approach on file is 2 to 21 degrees off the hull's axis, where the hull entry and
; the model's fixed 3 u stop nearly agree. These are the ship and aircraft sections of guidance-state-dl.ini with
; every target turned to steam at right angles to its line of fire, which is where they disagree most: a
; centre-aimed skimmer meets the hull 24 m from the centre abeam against 172 m bow-on.
;
; Each target gets a heading AND a course point 50 nm ahead, because a unit steers back onto its waypoint list.
; The aircraft mission's second merchant is moved 30 nm south first, so the turned tanker does not sail into it.
;
; Compression 2, not 10: FinalRangeM and the end of flight are sampled per frame, and at 10x a 540 kn Harpoon
; covers 46 m between samples and a 1900 kn YJ-18A 163 m.
;
; Predictions were written in the plan before this flew.
[beam-closing-30nm]
Mission=autotot aircraft follower beam.ini
Compression=2
WaitForContactSec=240
TimeoutSec=3000
HoldUntilRangeNm=Taskforce1Aircraft1:30
Shot1=Taskforce1Aircraft1 > Taskforce2Vessel1 | usn_agm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-18a | 2

[beam-pool]
Mission=autotot test aa beam.ini
Compression=2
WaitForContactSec=120
TimeoutSec=3000
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 1
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 1
Shot3=Taskforce1Vessel2 > Taskforce2Vessel1 | plan_yj-18a | 2
Shot4=Taskforce1Vessel2 > Taskforce2Vessel2 | plan_yj-18a | 2
