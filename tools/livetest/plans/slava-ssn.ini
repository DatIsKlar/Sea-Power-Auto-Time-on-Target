; One section per game launch. The driver splits a multi-section file itself.
; Shot lines: Shooter > Target | ammo | salvo   (ammo * = first missile that matches and is in range)
[slava-ssn]
Mission=test tot slava.ini
Compression=10   ; 10 = physics cap: above it the step is enlarged and the lab excludes the round. Game itself caps at 20x with missiles in flight. Tick is 60 Hz, or 30 Hz at low fps; both are recorded per round
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel7 > Taskforce2Vessel1 | * | 1
