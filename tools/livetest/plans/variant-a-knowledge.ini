; S4 knowledge case of docs/plans/open/max-solo-error-below-1s.md, "Variant A build". The hull an estimate ends at
; is sized by what the shooter's side knows about the contact. On variant-a-spread.ini the MV Acadia of
; `autotot rgm109b 77nm` read as a radar contact (`size VeryLarge`, class hull) on one round and identified (its own
; collider) on the other. This flies the same Tomahawk shot with every Taskforce1 radar off, the four aircraft and
; the Kidd (18 nm from the target) removed, and the Oscar moved 4 nm abeam the target, slow and on a parallel
; course, as a sensor only. The shooter stays 77 nm out, beyond sight, so the side's only track on the target is the
; submarine's passive sonar: the capture should read `HullSource = noise` (the Medium class hull). `size` would mean
; a sensor that shows size held it, `no track` that nothing did.
; Criteria were written in the plan before this flew.

[va-rgm109b-sonar-10x]
Mission=autotot rgm109b 77nm sonar.ini
Compression=10
WaitForContactSec=600
TimeoutSec=1800
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-109b | 2
