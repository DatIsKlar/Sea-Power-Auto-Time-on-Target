; D-L of docs/plans/open/max-solo-error-below-1s.md: the missile's own guidance state, logged into each
; round's .result. One flight answers three questions: where the game computes the lead intercept point
; that times the YJ-18A's stage switches, which launcher position a round spawns at, and what moves a
; Harpoon's aim point along the hull. Both sections are exact repeats of earlier ones, so a mission load
; draws the same random rolls (motor, INS drift) as the captures already in the corpus:
;   dl-closing-30nm       = closing-shooter-diagnostic.ini [closing-30nm] (runs 20260913-090557, 091641)
;   dl-pool-follower      = pooled-release-lead-baseline.ini [pool-follower-baseline] (runs 20260913-154314, 155558)
; Criteria were written in the plan before this ran.
[dl-closing-30nm]
Mission=autotot aircraft follower.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
HoldUntilRangeNm=Taskforce1Aircraft1:30
Shot1=Taskforce1Aircraft1 > Taskforce2Vessel1 | usn_agm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-18a | 2

[dl-pool-follower]
