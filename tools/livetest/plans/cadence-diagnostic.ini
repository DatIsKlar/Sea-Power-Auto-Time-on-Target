; DIAGNOSTIC for launcher-startup-delay item 3 (per-round cadence). Measures observed cadence
; against the modelled ShotInterval on three launchers with very different geometry, before any
; change is built. Read the `dispatch` (declared sharedLaunchInterval, launcher count), the
; `launcher-startup` (cycle breakdown) and the `anchored` (observed cadence) lines.
;
; Loadouts from the 2026-09-12 inventory probe of this mission:
;   Spruance VLS: usn_rgm-109b, usn_rgm-84d       Type 055: plan_yj-20, plan_yj-18a, plan_hhq-9b
;   Chandler:     usn_rim-66b, usn_rgm-84a        Granit (SSGN): wp_ss-n-19
;   F/A-18A:      usn_agm-84d                     MiG-27: wp_as-14b
