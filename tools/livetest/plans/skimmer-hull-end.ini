; BR3 of docs/plans/open/max-solo-error-below-1s.md, "Skimmers under hull A": do the sea-skimmers that read
; worse under hull variant A really end before the hull, or does the capture end their flight a frame early?
; The recorded flight ends at the last frame a round was seen alive; the new FlightEndImpact field reads the
; impact point the game leaves in the destroyed round's transform, and FlightEndGone the frame it was first
; missed. Every losing round on file flew at 10x. Each shot flies at 10x and again at 2x, where a frame is
; one or two physics ticks.
;
; Shots are the ones that produced the losing captures: wp-families (ss-n-22, ss-n-22b, ss-n-3, ss-n-12,
; ss-n-19 as control), shallow-ssn14b, rgm109b-77nm, the rgm-84a of d3-multi-domain, and periscope-fire's
; ss-n-3 at the small Yuniy Partizan.
;
; Criteria were written in the plan before this flew.
[skim-wp-10x]
Mission=autotot wp families.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel5 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel6 | wp_ss-n-12 | 1
Shot3=Taskforce1Submarine1 > Taskforce2Vessel7 | wp_ss-n-3 | 1
Shot4=Taskforce1Vessel5 > Taskforce2Vessel8 | wp_ss-n-22b | 1
Shot5=Taskforce1Vessel4 > Taskforce2Vessel9 | wp_ss-n-22 | 1

