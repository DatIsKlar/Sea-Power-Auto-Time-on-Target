; CONFIRMATION for docs/plans/open/yj-20-loft-variance.md, at a steady physics step.
;
; The 2026-09-12 diagnostic flew all six rounds with MinFlownStep 0.0167 and MaxFlownStep 0.0333,
; so the step moved from 60 Hz to 30 Hz mid-flight on every one and the offline lab excludes the
; whole run. Run this with WINDOW=1280x720 so the frame rate holds the 60 Hz step.
;
; Kill criteria are in the plan and were written before this ran. Bimodal again at 93 nm means the
; split is float noise inside the game's guidance and is irreducible; one mode means the 2026-09-12
; result was an artefact of the enlarged step.
;
; Three ranges rather than one, to test the ends of the band: the weapon's floor is near 60 nm and
; nothing has been flown beyond 93 nm.

[yj20-steady-93nm]
Mission=autotot yj20 loft.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-20 | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-20 | 2
Shot3=Taskforce1Vessel1 > Taskforce2Vessel3 | plan_yj-20 | 2

