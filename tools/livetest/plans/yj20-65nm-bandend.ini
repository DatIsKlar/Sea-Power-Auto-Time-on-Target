; BAND END for docs/plans/open/step-excursion-exclusion.md, rule 3.
;
; The 0.32 s figure is one point, measured where the round spent a TENTH of its flight at the
; enlarged step. The decision needs the other end: a round that spends most of its flight at 30 Hz.
;
; Same mission as the two 65 nm runs already flown, because a repeat run of one mission draws the
; same per-round motor rolls. Run this at a resolution large enough to hold the frame rate under
; 30 fps, and read StepChanges in each .result to confirm what was actually flown rather than
; assuming the load worked.
[yj20-65nm-bandend]
Mission=autotot yj20 65nm.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-20 | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-20 | 2
Shot3=Taskforce1Vessel1 > Taskforce2Vessel3 | plan_yj-20 | 2
