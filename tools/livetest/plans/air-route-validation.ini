; Validation for the 2026-09-13 pair: the waypoint route enabled for air-launched rounds, and the
; closest-approach guard requiring slant range to recede as well as flat. Same mission and same
; aircraft in every section; only the range the Hornet fires from changes.
;
; 60 nm is the long control. 12 nm puts the round at about 82 s. 8 nm is the case the pair is for:
; the round launches well inside TerminalApproachDist (8 nm), its terminal waypoint has
; AllowExceedingAngleLimits left at the default true with PitchMode Immediate, and the game dives
; it to -90 degrees with zero ground speed for about eleven seconds before pulling out.
;
; Offline on the captured rounds the pair gives -0.03 to +1.16 s across all four ranges, against
; 2.98 s mean and 8.93 s max for the older altitude law. MinLaunchRange is 3.5 nm, so 8 nm is a
; legal shot.
[air-route-60nm]
Mission=autotot aircraft follower.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
HoldUntilRangeNm=Taskforce1Aircraft1:60
Shot1=Taskforce1Aircraft1 > Taskforce2Vessel1 | usn_agm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | plan_yj-18a | 2

