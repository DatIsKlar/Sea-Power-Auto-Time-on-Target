; usn_rim-66b and usn_rim-66e against a MERCHANT, which is how their existing
; captures were taken and the only way they can be scored.
;
; An air target does not work, and the reason is structural rather than a mission
; problem: an aircraft fired at BREAKS. Six rounds flown at settled E-2Cs on
; 2026-09-13 recorded the target turning 111 to 158 degrees and accelerating from
; 238 to 315 kn during the flight, and every one was excluded as motion no
; launch-time snapshot could predict. That exclusion is correct. The earlier
; attempt, firing at aircraft still turning off their spawn heading, was excluded
; for the same reason at 20 to 27 degrees.
;
; usn_rim-162h gets its own section because it reads "out of range" against a
; merchant at 65, 20 and 10 nm while usn_rim-66p and usn_rim-174b on the same
; ship read USABLE: for a semi-active SAM against a surface contact the
; illuminator's horizon is what binds, and a rejected shot fails the whole
; section. 5 nm is the shortest geometry worth trying before concluding the
; family cannot be captured at all.
[sam-surface]
Mission=autotot sam surface.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rim-66b | 1
Shot2=Taskforce1Vessel3 > Taskforce2Vessel3 | usn_rim-66e | 1

[sam-surface-2]
Mission=autotot sam surface.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rim-66b | 1
Shot2=Taskforce1Vessel3 > Taskforce2Vessel3 | usn_rim-66e | 1

[essm-surface-5nm]
Mission=autotot sam surface.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
Shot1=Taskforce1Vessel2 > Taskforce2Vessel2 | usn_rim-162h | 1

; Kill criterion 4 for docs/plans/open/terminal-loft-leg.md: a LONGER SAM shot as
; well as the 5 nm one, so the fix is seen on a geometry the terminal leg was not
; governing. rim-66p and rim-174b on the same Burke are NOT TerminalLoft weapons
; and are the control: they must not move.
[sam-long-control]
Mission=autotot sam surface.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
Shot1=Taskforce1Vessel2 > Taskforce2Vessel1 | usn_rim-66p | 1
Shot2=Taskforce1Vessel2 > Taskforce2Vessel3 | usn_rim-174b | 1
