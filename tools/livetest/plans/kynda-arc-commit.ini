; D5 of docs/plans/open/game-update-s367-reverification.md. Stable s367 changed how a ship steers to
; fire: it now commits to one firing arc and keeps it (Vessel.SelectAlignmentArc), where s366 steered
; to the closest heading inside any allowed arc. This asks whether a beam-only launcher still splits
; its ripple across turns, and whether a second turn can still settle on the opposite beam.
;
; A Kynda (two SS-N-3B mounts, FiringArcs=-105,-75|75,105) fires two 2-round orders at two merchants
; dead ahead. The mission and shots repeat the s366 run 20260913-105407-recapture-ssn3b, so the 10x
; section is an A/B against a flown s366 run. There the ship turned for 65 s, put one round off each
; mount at relative bearing -75, stopped aligning, and the other two rounds never left.
;
; Read the turns from the engage-state lines (target rel brg, aligning) and the launch times from
; gamelogs/*sessionEventLog*. Ship manoeuvre behaviour is not reproducible across compression
; settings, so both are flown. TimeoutSec covers a second turn: rounds that never leave hold the
; run to the timeout.
[kynda-arc-10x]
Mission=autotot kynda ssn3b 65nm.ini
Compression=10
WaitForContactSec=120
TimeoutSec=480
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 2

[kynda-arc-1x]
Mission=autotot kynda ssn3b 65nm.ini
Compression=1
WaitForContactSec=120
TimeoutSec=480
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 2
