; Public-branch formation freeze, stuck-order run (docs/plans/open/public-formation-freeze.md). Runs 1 to 3
; did not freeze, and run 3 never produced a stuck order: the Kirov's ripple finished at 30.08 nm and the
; Slava, 0.8 nm closer inside the formation, was already inside the 30 nm minimum, so the panel left it out.
;
; This run creates the stuck order directly. Enterprise starts 29.5 nm from the Kirov (28.1 nm from the
; Slava), inside the SS-N-19 and SS-N-12 minimum launch range. Right after contact the runner gives both
; ships direct orders through Coordinator.FireNow, which the game accepts and should never complete: the
; ship turns to unmask and holds. The Ticonderoga's Harpoons arrive with those orders in place.
;
; The question: does a ship holding an order the game cannot finish freeze the formation's radars or its
; air defence? Yes means game behaviour the mod can trigger (the old default ticks, or a held order released
; inside minimum range). No means stuck orders do not explain the report. Read the event log: Kirov and
; Slava engage tasks accepted with no launches, and whether every ship keeps accepting engagements against
; the inbound Harpoons. TimeoutSec is the observation window.
[freeze-stuck]
Mission=autotot freeze stuck order.ini
Compression=1
WaitForContactSec=240
HoldUntilSec=30
TimeoutSec=600
TraceFlightModel=false
FireNow=true
AllowInsideMinRange=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 20
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | wp_ss-n-12 | 16
