; Public-branch formation freeze, run T1 (docs/plans/open/public-formation-freeze.md). A Workshop user
; reported that after a planner strike from a Kirov and a Slava at Enterprise the whole formation froze:
; radars stopped, ships flipped between engaging an inbound missile and "In Formation", manual fire did
; nothing, and the strike never launched.
;
; The runner fires through Coordinator.FireCoordinated, the same call the panel's FIRE THIS TARGET makes
; (UI/Hud.Render.cs:916). The strike is held to sim 240 s so its launches overlap the Ticonderoga's
; Harpoons; the enemy E-2C 40 nm behind Enterprise is what lets the enemy see us at 48 nm and fire.
; The Kynda and the two Sovremennys are in the Kirov's formation and fire nothing, as in the report.
;
; Run at 1x, as a player would. Evidence to read: repeating Unity exceptions in the game's session log,
; and whether the escorts' EngageTask events against the Harpoons become launches. A dead per-frame
; object loop stops HandleEngageTasks everywhere, so it shows as a strike that never launches and a run
; that ends STUCK.
[freeze-t1]
Mission=autotot freeze kirov slava enterprise aew.ini
Compression=1
WaitForContactSec=240
HoldUntilSec=240
TimeoutSec=900
TraceFlightModel=false
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 8
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | wp_ss-n-12 | 8
