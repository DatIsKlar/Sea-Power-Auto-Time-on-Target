; Aircraft as ANCHOR, with a ship following. The case docs/plans/open/anchor-liveness.md is about:
; an aircraft's launches can arrive after its order retires, and the launch-state snapshot that
; plan records as a regression once returned 1218.9 s for a 676.1 s shot with no trace and no
; plausibility ceiling. Watch the `anchored` slide and the predicted flight against the actual.
;
; Geometry makes the election automatic: both shooters are about 70 nm out, the Hornet's Harpoon
; is subsonic and the 055's YJ-20 is hypersonic, so the aircraft has by far the longest enroute
; and is elected anchor. The Hornet starts level at 20,000 ft heading at the target, which is
; deliberate: the game will not fire while climbing past ten degrees, and at 37,000 ft its own
; climb blocks the second round.
;
; Loadouts from the 2026-09-12 probe: F/A-18A usn_agm-84d x2; Type 055 plan_yj-20, plan_yj-18a.
[aircraft-anchor]
Mission=mission 1 ship 1 plane 1 merchant.ini
Compression=10
WaitForContactSec=240
TimeoutSec=2400
Shot1=Taskforce1Aircraft1 > Taskforce2Vessel1 | usn_agm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel1 | plan_yj-20 | 2
