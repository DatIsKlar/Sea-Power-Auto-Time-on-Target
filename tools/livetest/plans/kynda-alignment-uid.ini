; A6 and A7 of docs/plans/done/2026-09-15-beam-only-launcher-alignment.md, written after A3 killed H1.
;
; H5: a launcher that has fired the part of an order it took ends the order's alignment
; (WeaponSystem.EndEngageTask), the ship re-accepts the rest under the same uid with a second
; alignment, and ObjectBase.EndAlignment removes that replacement first when the old one's end delay
; runs out. Both go, and the order's remaining rounds stay aboard.

; A6: four 1-round orders. No order is re-accepted, so no uid is shared.
[single-shots-10x]
Mission=autotot kynda ssn3b 65nm.ini
Compression=10
WaitForContactSec=120
TimeoutSec=600
FireNow=true
TraceFlightModel=false
AlignmentTrace=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 1
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 1
Shot3=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 1
Shot4=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 1

; A7: the shots of align-firenow-10x with the counterfactual: when two alignments share a uid,
; EndAlignment removes the ending one instead of its replacement.
[uid-fix-firenow-10x]
Mission=autotot kynda ssn3b 65nm.ini
Compression=10
WaitForContactSec=120
TimeoutSec=600
FireNow=true
TraceFlightModel=false
AlignmentTrace=true
AlignmentUidFix=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 2
