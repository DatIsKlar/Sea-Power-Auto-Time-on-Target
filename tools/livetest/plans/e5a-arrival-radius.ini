; DIAGNOSTIC for the E5A arrival radius, the last open item of max-solo-error-below-1s.
;
; The model stops at CloseEnoughDistU, 3u from the target's CENTRE. The game's arrival is the
; target's trigger collider, so where a round ends up depends on the hull it meets and on the angle
; it meets it from. Every corpus shot so far is bow-on and at 10x compression, which is exactly the
; case that cannot separate the two.
;
; Two sections, the same shooter, ammunition and range, differing only in the target's aspect. The
; beam-on mission turns the merchant through 90 degrees AND moves its waypoint, because a unit
; steers back onto its waypoint list and heading alone will not hold for a 500 s shot.
;
; Compression 2, not 10: FinalRangeM is sampled per tick, and at 10x a Tomahawk covers about 80 m
; between samples, which is three times the tolerance this test is judged on.
;
; Kill criterion, from the plan: a length by beam by height box predicts FinalRangeM worse than
; plus or minus 30 m on the beam-on shots. The capture now records TargetLengthM and TargetBoundsM
; so the box can be built offline rather than guessed.

[e5a-bow-on]
Mission=teest_us.ini
Compression=2
WaitForContactSec=240
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-109e5a | 2

[e5a-beam-on]
Mission=autotot e5a beam on.ini
Compression=2
WaitForContactSec=240
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-109e5a | 2
