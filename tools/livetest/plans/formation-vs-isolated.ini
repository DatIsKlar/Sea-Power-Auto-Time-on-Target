; The flight owed by docs/plans/open/formation-gap-blind-spot.md: one coordinated strike at a
; formation of same-class ships AND, in the same mission, one round at an isolated ship. The
; isolated round is the reference: its strict `gap` is the only way to tell whether the substitute
; path is calibrated at all.
;
; test tot slava suits this exactly. Taskforce2Vessel1 to 4 are four Yuniy Partizan in close
; formation about 124 nm from the Slava, and Taskforce2Vessel5 is a lone Ritina about 49 nm from
; the Kirov, a thousand miles away from the formation.
[formation-vs-isolated]
Mission=test tot slava.ini
Compression=10
WaitForContactSec=300
TimeoutSec=2400
Shot1=Taskforce1Vessel7 > Taskforce2Vessel1 | wp_ss-n-12 | 3
Shot2=Taskforce1Vessel1 > Taskforce2Vessel5 | wp_ss-n-19 | 1
