; Public-branch formation freeze, T1 through the PANEL (docs/plans/open/public-formation-freeze.md).
; freeze-public.ini fired through Coordinator.FireCoordinated with no target selected and the panel
; closed, and nothing froze. The reporter fired from the panel: Enterprise selected, weapons ticked on a
; Kirov and a Slava, FIRE THIS TARGET, with the panel still open while the order was held.
;
; PanelFire stages exactly that: the Kirov's whole formation on the roster (Kirov, Slava, Kynda and the
; two Sovremennys, as + FORMATION adds them), Enterprise as the target, the two rows ticked, the panel
; open from contact on, through the 240 s hold, the release and the flight, and the strike sent by the
; button's own FireSelected. Same mission and timings as freeze-public.ini, so the two runs compare.
[freeze-t1-panel]
Mission=autotot freeze kirov slava enterprise aew.ini
Compression=1
WaitForContactSec=240
HoldUntilSec=240
TimeoutSec=900
TraceFlightModel=false
PanelFire=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 8
Shot2=Taskforce1Vessel2 > Taskforce2Vessel1 | wp_ss-n-12 | 8
