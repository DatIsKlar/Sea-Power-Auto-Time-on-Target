; D12 for docs/plans/open/launcher-startup-delay.md item 4.
;
; Hypothesis: the first round of an order that FOLLOWS another order on the same
; ship for the same SystemName waits max(0, sharedInterval - elapsed), and that
; wait is absent from StartupLead today.
;
; Read the answer from the `engage-state` lines, not from the arrival numbers:
; the state machine names SharedLaunchDelay and prints how long it was held.
[shared-timer-A-reproduce]
; Two targets at 77.4 and 77.2 nm, so the orders release about 1 s apart and the
; follower lands INSIDE the 5 s interval. Expect SharedLaunchDelay about 4 s and
; a first-round delay near 6.7 s. Failure to reproduce means the one observation
; was not a mechanism.
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 1
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 1

[shared-timer-B-elapsed]
; THE DECISIVE SECTION. Same ship and weapon, but the second target is 73.4 nm
; against 77.4, so the second order releases about 26 s later and the 5 s interval
; has fully elapsed. SharedLaunchDelay must SHRINK TO ABOUT ZERO and the follower's
; first round cost about 2.7 s. A delay that stays near 4 s disproves the timer:
; it would be a fixed per-order cost instead.
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 1
Shot2=Taskforce1Vessel1 > Taskforce2Vessel3 | usn_rgm-84d | 1

[shared-timer-C-control]
; Negative control. The Kirov's SS-N-19 declares NO SharedLaunchInterval and has
; ONE launcher, so no SharedLaunchDelay state may appear at all. Any follower
; delay here belongs to the busy-launcher path, which the trace will name. A
; SharedLaunchDelay on a ship that declares no interval means the state is not
; driven by that field and the whole reading is wrong.
Mission=autotot ssn19 ssn12.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-19 | 1
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-19 | 1
