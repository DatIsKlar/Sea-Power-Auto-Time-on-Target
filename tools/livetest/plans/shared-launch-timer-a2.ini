; D12 section A, corrected. The first cut fired ONE round per order while the
; observation it exists to reproduce came from TWO, so it changed the thing under
; test: the shared timer is measured from the ship's last launch of that
; SystemName, and a 2-round anchor loads it twice, once just before the follower
; wants the rail. With 1-round orders the timer is barely loaded and the follower
; paid 1.7 s instead of 6.7.
;
; This section is rail-pick's geometry exactly: 2 rounds per order, two targets
; about 1 s apart in release.
[shared-timer-A2]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 2

; And the same with FOUR rounds per order, which loads the timer three more times
; before the follower is served. If the mechanism is the timer, the follower's
; wait must not exceed the declared 5 s however many rounds precede it.
[shared-timer-A4]
Mission=autotot test aa settled.ini
Compression=10
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | usn_rgm-84d | 4
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | usn_rgm-84d | 4
