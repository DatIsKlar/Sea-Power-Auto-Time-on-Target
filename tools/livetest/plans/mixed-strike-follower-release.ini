; A mixed strike through the planner panel, the way the user flew it on stable s367 (2026-09-15):
; a Kirov's SS-N-19 and a Slava's SS-N-12 at one merchant. The SS-N-19 has the longer enroute and
; anchors, so the SS-N-12 order is held until the anchor's first round is seen leaving.
;
; On s367 the launch tracker threw MissingFieldException (ObjectBaseParameters._length) on every
; frame a missile was airborne, the anchor's launches were never credited, and the SS-N-12 order
; was dropped when the target sank. Pass: both ammunitions launch, no "coordinator tick error"
; and no "dropped held" line in the log.
;
; TraceFlightModel off, as in the user's config: the failing read ran with both gates in any
; state, and this is an order-count check, not an accuracy measurement.
[mixed-strike-follower-release]
Mission=test tot slava 4 merchants.ini
Compression=10
WaitForContactSec=120
TimeoutSec=500
PanelFire=true
TraceFlightModel=false
Shot1=Taskforce1Vessel1 > Taskforce2Vessel5 | wp_ss-n-19 | 11
Shot2=Taskforce1Vessel2 > Taskforce2Vessel5 | wp_ss-n-12 | 11
