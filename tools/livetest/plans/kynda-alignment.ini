; Phase 1 of docs/plans/done/2026-09-15-beam-only-launcher-alignment.md. A Kynda (two SS-N-3B mounts,
; FiringArcs=-105,-75|75,105) fires two 2-round orders at two merchants. On s366 and s367 it turned
; once, fired from the port beam, lost its alignment, and one or two rounds never left.
;
; AlignmentTrace logs every alignment the game creates and ends, with the caller, and the ship's
; steering once a sim second. TraceFlightModel is off: this is launcher behaviour, not flight time.

; A3: the shots of kynda-arc-10x, coordinated as before.
[align-coordinated-10x]
Mission=autotot kynda ssn3b 65nm.ini
Compression=10
WaitForContactSec=120
TimeoutSec=480
TraceFlightModel=false
AlignmentTrace=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 2

; A4: the same shots as direct orders, both accepted at t+0 as on s366, watched for 900 s.
[align-firenow-10x]
Mission=autotot kynda ssn3b 65nm.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
FireNow=true
TraceFlightModel=false
AlignmentTrace=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 2

; A5: the Kynda's waypoint due north and both targets at bearing 20, so the arc nearest the current
; heading (port) and the arc nearest the waypoint course (starboard) differ.
[arc-choice-10x]
Mission=autotot kynda arc choice.ini
Compression=10
WaitForContactSec=120
TimeoutSec=600
FireNow=true
TraceFlightModel=false
AlignmentTrace=true
Shot1=Taskforce1Vessel1 > Taskforce2Vessel1 | wp_ss-n-3b | 2
Shot2=Taskforce1Vessel1 > Taskforce2Vessel2 | wp_ss-n-3b | 2
