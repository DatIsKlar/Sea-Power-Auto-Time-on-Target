; PR1 to PR3 of docs/plans/open/max-solo-error-below-1s.md, "Drag pitch rate": does the pitch rate the game
; hands CalculateDrag jitter from tick to tick once the motor is off? Offline, the three traced SAMs keep their
; recorded speed through the descent only when the stall term is given no nose-down rate at all, which the
; source does not explain. PitchRateTrack records the rate the game reads, once a frame.
;
; The 65 nm usn_rim-66p geometry of sam-refly-65nm: two rounds at each of two tankers, 118 km, about 140 s.
; Once at 10x, where a frame is several ticks and only its last tick is sampled, and once at 2x, where a
; frame is a tick or two and the sample is close to every tick. The 2x section is the unbiased reading.
;
; Criteria were written in the plan before this flew.
[pitch-rate-sam-10x]
Mission=autotot yj20 65nm.ini
Compression=10
WaitForContactSec=120
TimeoutSec=900
Shot1=Taskforce1Vessel2 > Taskforce2Vessel1 | usn_rim-66p | 2
Shot2=Taskforce1Vessel2 > Taskforce2Vessel2 | usn_rim-66p | 2

[pitch-rate-sam-2x]
Mission=autotot yj20 65nm.ini
Compression=2
WaitForContactSec=120
TimeoutSec=1500
Shot1=Taskforce1Vessel2 > Taskforce2Vessel1 | usn_rim-66p | 2
Shot2=Taskforce1Vessel2 > Taskforce2Vessel2 | usn_rim-66p | 2
